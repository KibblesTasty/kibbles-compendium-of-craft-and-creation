system:
  description:
    value: >-
      <p>On your turn, you can replace your movement by teleporting 5 feet in
      any direction to a space you can see. You can pass through creatures but
      can’t pass through objects, buildings or terrain more than 4 inches thick.
      This distance increases by 5 feet at 5th level (to 10 feet), at 11th level
      (to 15 feet), and becomes equal to your speed at 17th level. This replaces
      all movement for your turn when used.</p>
