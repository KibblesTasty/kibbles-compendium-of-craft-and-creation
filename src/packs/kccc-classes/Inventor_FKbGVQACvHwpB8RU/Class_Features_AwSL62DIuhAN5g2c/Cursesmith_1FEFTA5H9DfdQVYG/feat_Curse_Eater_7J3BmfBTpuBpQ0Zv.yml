system:
  description:
    value: "<p>You consume your Forbidden Artifact, destroying it and afflicting yourself with a terrible curse. You gain a melee natural weapon as the manifestation of this cursed power. On hit, this weapon deals 1d8 damage of your choice of bludgeoning, piercing, or slashing damage (selected when you gain this feature), and 1d4 necrotic damage. All effects that apply to a Forbidden Artifact apply to this natural weapon. You can apply Soul Investiture to this natural weapon.\_</p><p>Additionally, you can absorb any item you create with this specialization, innately gaining its effect and curse. At the start of your turn while you are not incapacitated you gain temporary hit points equal to 1 + the number of cursed items you have consumed with this ability. If you are under the effect of bane, this becomes 1d4 + the number of cursed items you have consumed with this ability.</p><p>Additionally, when you gain temporary hit points from this feature, you can instead regain hit points equal to the temporary hit points you would have gained. You can regain hit points this way a number of times equal to your proficiency bonus, regaining all uses on a long rest.</p><p>When you select this path, you learn the following spells at the following levels. These spells do not count against your spells known, and are Inventor spells for you.</p><table><thead><tr><th><p><strong>Inventor Level</strong></p></th><th><p><strong>Spell</strong></p></th></tr></thead><tbody><tr><td><p>3rd</p></td><td><p>@Compendium[dnd5e.spells.ksaaTxIbKx2sJfia]{Inflict Wounds}</p></td></tr><tr><td><p>5th</p></td><td><p>@Compendium[dnd5e.spells.S7VbUetIfVT7B6Eq]{Darkness}</p></td></tr><tr><td><p>9th</p></td><td><p>@Compendium[kibbles-compendium-of-craft-and-creation.kccc-spells.q4y6ERr3SBxm6zWt]{Mutate}</p></td></tr><tr><td><p>13th</p></td><td><p>@UUID[Compendium.kibbles-compendium-of-legends-and-legacies.kcll-spells-vol-2.Item.XYlNm2hWK5pNq2sz]{Ichorous Blood}</p></td></tr><tr><td><p>17th</p></td><td><p>@Compendium[kibbles-compendium-of-craft-and-creation.kccc-spells.DULroJrfyUiDGRny]{Devouring Darkness}</p></td></tr></tbody></table>"
