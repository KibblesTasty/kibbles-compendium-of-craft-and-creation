system:
  description:
    value: >-
      <p>Your soul can carry great burdens. When you are under the effect of
      bane, you can choose to ignore the effect for a roll. Once you choose to
      ignore the effect, you can’t do so again until the start of your next
      turn.</p><p>Additionally, when you suffer the effect of any curse from one
      of the upgrades granted by this class, you can suppress the effect,
      ignoring its negative consequences. You can do this a number of times
      equal to your proficiency bonus, regaining all uses on a long rest. If the
      curse is an ongoing effect, it is suppressed until the start of your next
      turn.</p><blockquote><p><strong>Other Curses</strong></p><p>At your GM’s
      discretion, you may be able to use this feature to shrug off the effects
      of other lesser curses.</p></blockquote><p>When you select this path, you
      learn the following spells at the following levels. These spells do not
      count against your spells known, and are Inventor spells for
      you.</p><table><thead><tr><th><p>Inventor
      Level</p></th><th><p>Spell</p></th></tr></thead><tbody><tr><td><p>3rd</p></td><td><p>@Compendium[dnd5e.spells.xmDBqZhRVrtLP8h2]{Protection
      from Evil and
      Good}</p></td></tr><tr><td><p>5th</p></td><td><p>@Compendium[dnd5e.spells.JVhKeanAXZH62DrF]{Warding
      Bond}</p></td></tr><tr><td><p>9th</p></td><td><p>@Compendium[dnd5e.spells.j8NtLXOOJ3GAKF8I]{Protection
      from
      Energy}</p></td></tr><tr><td><p>13th</p></td><td><p>@Compendium[dnd5e.spells.VtCXMdyM6mAdIJZb]{Death
      Ward}</p></td></tr><tr><td><p>17th</p></td><td><p>@Compendium[dnd5e.spells.TkJ8Wtg1L7TZtspm]{Dispel
      Evil and Good}</p></td></tr></tbody></table>
