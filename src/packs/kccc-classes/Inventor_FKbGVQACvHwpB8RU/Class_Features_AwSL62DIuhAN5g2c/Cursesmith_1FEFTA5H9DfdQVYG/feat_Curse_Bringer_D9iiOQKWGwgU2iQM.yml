system:
  description:
    value: >-
      <p>You can force your soul's burdens onto others. When you make an attack
      roll while under the effect of bane, if you hit the creature after rolling
      a 3 or 4 on the d4 from bane, the target suffers the effect of bane until
      the end of your next turn. This effect is extended to the end of your
      subsequent next turn if you hit them your Forbidden Artifact again while
      they are afflicted (regardless of the roll of the bane
      die)</p><p>Additionally, when you suffer the effect of any curse of one of
      the upgrades granted by this class, as a reaction, you can force another
      creature within 30 feet to make a Charisma saving throw against your spell
      save DC or suffer the same effect. You can do this a number of times equal
      to your proficiency bonus, regaining all uses on a long rest.</p><p>When
      you select this path, you learn the following spells at the following
      levels. These spells do not count against your spells known, and are
      Inventor spells for you.</p><table><thead><tr><th><p><strong>Inventor
      Level</strong></p></th><th><p><strong>Spell</strong></p></th></tr></thead><tbody><tr><td><p>3rd</p></td><td><p>@Compendium[dnd5e.spells.95K2aUhAGV9qXjnf]{Bane}</p></td></tr><tr><td><p>5th</p></td><td><p>@Compendium[kibbles-compendium-of-craft-and-creation.kccc-spells.6cFfHnF9WfDGESQV]{Disorient}</p></td></tr><tr><td><p>9th</p></td><td><p>@Compendium[dnd5e.spells.pO4zGe5LmFIYqJiL]{Bestow
      Curse}</p></td></tr><tr><td><p>13th</p></td><td><p>@Compendium[dnd5e.spells.BYNvBJzHcF5VJhXw]{Phantasmal
      Killer}</p></td></tr><tr><td><p>17th</p></td><td><p>@Compendium[kibbles-compendium-of-craft-and-creation.kccc-spells.Y1JG6RgBaHe6t1XV]{Killing
      Curse}</p></td></tr></tbody></table>
