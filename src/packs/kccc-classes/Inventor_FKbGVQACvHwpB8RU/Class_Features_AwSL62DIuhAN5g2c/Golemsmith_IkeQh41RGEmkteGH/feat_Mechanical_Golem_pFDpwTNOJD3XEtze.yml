system:
  description:
    value: "<p>Starting at 1st level, you forge a mechanical golem to carry out your orders and protect you. The golem is under your control and understands the languages you speak, but it can’t speak.</p><p>The golem obeys your commands as best it can. On your turn, you can verbally command it where to move (no action required by you), and you can use your action to command it to take an action. Additionally, whenever it would be able to take a reaction, you must use your reaction to command it to take that reaction. The golem acts on your commands during your turn. If you issue no commands to your golem, it takes no actions.</p><p>Your golem’s proficiency bonus increases when yours does. If the golem is killed, it can be returned to life by normal means, such as the revivify spell, or you can repair it during a long rest if you have access to its body. At the end of the long rest, it returns to life with half its hit points (rounded down).\_</p><p>If the golem is beyond recovery, you can recreate it exactly as it was, with four days of work (8 hours each day) and 100 gp of raw materials.</p><p>Over the course of a short rest, you can restore hit points to your golem equal to your Intelligence modifier + your inventor level, or you can fully repair it to during a long rest, causing it to regain all its hit points. Any spells you cast that cause the target to regain hit points ignore any restrictions against constructs for your golem.</p><p>The base statistics of your golem are as follows:\_</p><p>\_@Embed[Compendium.kibbles-compendium-of-craft-and-creation.kccc-monsters.Actor.gbd2Vg6OSS1owrlR statblock caption=false]</p>"
