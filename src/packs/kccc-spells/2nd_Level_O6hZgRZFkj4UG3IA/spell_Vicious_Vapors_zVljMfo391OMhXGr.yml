system:
  description:
    value: >-
      <p>You conjure a swirling poisonous miasma around yourself. For the
      duration of the spell, you are lightly obscured. When you cast the spell,
      and as a bonus action on each subsequent turn, you can cause the vapors to
      surge out and swirl around up to three creatures of your choice within
      range. Each creature must make a Constitution saving throw. On a failed
      save, it takes 1d12 poison damage and becomes &amp;Reference[poisoned]
      until the start of your next turn. On a successful save, it takes half as
      much poison damage and is not poisoned.</p><p><strong>At Higher
      Levels.</strong> When you cast this spell using a spell slot of 3rd level
      or higher, the damage increases by 1d12 for each slot level above 2nd.</p>
