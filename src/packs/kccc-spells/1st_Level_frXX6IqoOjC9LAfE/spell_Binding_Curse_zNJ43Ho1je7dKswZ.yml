system:
  description:
    value: >-
      <p>You bind a creature to a point within 5 feet of it, causing a glowing
      chains of light to connect it to that point. For the duration of the
      spell, if the creature attempts to move away from that point, the must
      make a Wisdom saving throw, or be unable to move more than 5 feet away
      from from that point until the start of their next turn.</p><p>If a
      creature starts its turn more than 10 feet from the binding point, they
      must make a Strength saving throw or be dragged 5 feet toward the binding
      point.</p>
