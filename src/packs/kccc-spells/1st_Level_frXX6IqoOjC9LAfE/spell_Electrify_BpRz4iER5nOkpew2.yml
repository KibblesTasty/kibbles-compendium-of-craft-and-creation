    value: "<p>You channel lightning into your hands. The next time you hit a creature with a melee attack (including a melee spell attack) before the start of your next turn, the target takes 1d12 lightning damage and must make a Constitution saving throw. On a failed save, the target becomes &amp;Reference[stunned] until the start of their next turn.</p><p>The spell ends after dealing damage, or at the start of your next turn, whichever occurs first.</p><p>\_</p>"
